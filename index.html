<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="英文教練">
<meta name="theme-color" content="#f7f3ec">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23c08a52'/%3E%3Ctext x='90' y='118' font-size='88' text-anchor='middle' fill='%23fff' font-family='serif'%3EEn%3C/text%3E%3C/svg%3E">
<title>英文教練</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 登入 -->
<section id="login">
  <div class="logo">En</div>
  <h1>英文教練</h1>
  <p>只有你一個學生的英文補習班</p>
  <input id="loginEmail" type="email" autocomplete="username" placeholder="Email">
  <input id="loginPwd" type="password" autocomplete="current-password" placeholder="密碼">
  <button id="loginBtn">登入</button>
  <div id="loginErr"></div>
</section>

<!-- 主畫面 -->
<div id="app">
  <header class="topbar">
    <div>
      <div class="title" id="topTitle">今日課程</div>
      <div class="sub" id="topSub"></div>
    </div>
    <div class="actions">
      <button class="iconbtn" id="btnSpeakAll" title="朗讀本頁英文" aria-label="朗讀">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
      </button>
    </div>
  </header>

  <main>
    <section class="page" id="page-today"></section>
    <section class="page" id="page-assess"></section>
    <section class="page" id="page-cards"></section>
    <section class="page" id="page-progress"></section>
    <section class="page" id="page-settings"></section>
  </main>

  <nav class="tabbar">
    <button class="tab on" data-page="today">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
      今日
    </button>
    <button class="tab" data-page="cards">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="6" width="14" height="14" rx="2"/><path d="M8 4h12v12"/></svg>
      卡庫
    </button>
    <button class="tab" data-page="progress">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>
      進度
    </button>
    <button class="tab" data-page="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      設定
    </button>
  </nav>
</div>

<div id="toast"></div>
<div id="busy"><div class="spinner"></div><div id="busyText">老師正在準備…</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script src="app.js"></script>
</body>
</html>
